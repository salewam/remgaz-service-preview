name: Check server and static build

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22.22
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Check JavaScript syntax
        run: |
          node --check assets/form.js
          node --check assets/photo-loader.js
          node --check server/lead.mjs
          node --check server/http.mjs
          node --check server/config.mjs
          node --check scripts/build.mjs
          node --check deploy/nginx.mjs
          node --check deploy/install-assets.mjs

      - name: Check form, photos and server contracts
        run: npm test

      - name: Build static release without publishing
        run: npm run build

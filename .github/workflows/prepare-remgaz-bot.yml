name: Prepare Remgaz bot
run-name: Prepare Remgaz bot - ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: RSA public key in PEM SPKI format (at least 3072 bits)
        required: true
        type: string
      request_id:
        description: Unique identifier for this bootstrap request
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Encrypt bot token and read bot identity
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOOTSTRAP_PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          node <<'NODE'
          (async () => {
            try {
              const { constants, createPublicKey, publicEncrypt } = require('node:crypto');
              const { writeFileSync } = require('node:fs');

              const token = process.env.TELEGRAM_BOT_TOKEN;
              if (typeof token !== 'string' || token.trim().length === 0) {
                throw new Error();
              }

              const pem = (process.env.BOOTSTRAP_PUBLIC_KEY || '').trim();
              if (!pem.startsWith('-----BEGIN PUBLIC KEY-----') ||
                  !pem.endsWith('-----END PUBLIC KEY-----')) {
                throw new Error();
              }
              const publicKey = createPublicKey({ key: pem, format: 'pem', type: 'spki' });
              const modulusLength = publicKey.asymmetricKeyDetails?.modulusLength;
              if (publicKey.asymmetricKeyType !== 'rsa' ||
                  !Number.isInteger(modulusLength) || modulusLength < 3072) {
                throw new Error();
              }

              const response = await fetch(`https://api.telegram.org/bot${token}/getMe`, {
                method: 'GET',
                redirect: 'error',
                signal: AbortSignal.timeout(10_000),
              });
              if (!response.ok) {
                throw new Error();
              }
              const payload = await response.json();
              const bot = payload?.result;
              if (payload?.ok !== true || bot?.is_bot !== true ||
                  !Number.isSafeInteger(bot.id) || bot.id <= 0 ||
                  typeof bot.username !== 'string' || !/^[A-Za-z0-9_]+$/.test(bot.username) ||
                  typeof bot.first_name !== 'string') {
                throw new Error();
              }

              const encrypted = publicEncrypt({
                key: publicKey,
                padding: constants.RSA_PKCS1_OAEP_PADDING,
                oaepHash: 'sha256',
              }, Buffer.from(token, 'utf8'));
              writeFileSync('bot-token.enc', encrypted, { mode: 0o600 });
              writeFileSync('bot-info.json', JSON.stringify({
                id: bot.id,
                username: bot.username,
                first_name: bot.first_name,
              }) + '\n', { mode: 0o600 });
              console.log(`@${bot.username} / ${bot.id}`);
            } catch {
              console.error('Bot bootstrap failed. No secret details are logged.');
              process.exitCode = 1;
            }
          })();
          NODE

      - name: Upload encrypted token and bot identity
        uses: actions/upload-artifact@v4
        with:
          name: remgaz-bot-bootstrap
          path: |
            bot-token.enc
            bot-info.json
          retention-days: 1
          if-no-files-found: error

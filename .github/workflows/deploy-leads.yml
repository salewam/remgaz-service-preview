name: Deploy leads Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remgaz-leads-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/check-leads.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check branch and required secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '::error::This workflow only deploys from main.'
            exit 1
          fi
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Required GitHub Actions secret $key is missing."
              exit 1
            fi
          done

      - name: Install Wrangler 4.156.0
        run: npm install --global wrangler@4.156.0

      - name: Deploy Worker and Telegram secrets together
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LEAD_SECRETS_FILE: ${{ runner.temp }}/remgaz-leads-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          set -euo pipefail
          trap 'rm -f -- "$LEAD_SECRETS_FILE"' EXIT
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync(process.env.LEAD_SECRETS_FILE, JSON.stringify({
            TELEGRAM_BOT_TOKEN: process.env.TELEGRAM_BOT_TOKEN,
            TELEGRAM_CHAT_ID: process.env.TELEGRAM_CHAT_ID,
          }), { mode: 0o600, flag: 'wx' });
          NODE
          wrangler deploy --config wrangler.toml --secrets-file "$LEAD_SECRETS_FILE"
